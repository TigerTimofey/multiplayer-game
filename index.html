<html>
  <head>
    <title>Multiplayer Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" type="text/css" />
  </head>
  <body>
    <div class="game-container"></div>
    <div class="powers-menu">
      <div
        class="power-button"
        data-power="speed"
        data-cost="3"
        data-key="KeyW"
      >
        <div class="key-hint">W</div>
        <span>Speed</span>
        <div class="cost">3 coins</div>
        <div class="cooldown"></div>
      </div>
      <div
        class="power-button"
        data-power="shield"
        data-cost="5"
        data-key="KeyE"
      >
        <div class="key-hint">E</div>
        <span>Shield</span>
        <div class="cost">5 coins</div>
        <div class="cooldown"></div>
      </div>
      <div
        class="power-button"
        data-power="teleport"
        data-cost="4"
        data-key="KeyR"
      >
        <div class="key-hint">R</div>
        <span>Teleport</span>
        <div class="cost">4 coins</div>
        <div class="cooldown"></div>
      </div>
      <div class="power-button" data-power="grow" data-cost="6" data-key="KeyA">
        <div class="key-hint">A</div>
        <span>Grow</span>
        <div class="cost">6 coins</div>
        <div class="cooldown"></div>
      </div>
      <div
        class="power-button"
        data-power="ultimate"
        data-cost="12"
        data-key="KeyQ"
      >
        <div class="key-hint">Q</div>
        <span>Ultimate</span>
        <div class="cost">12 coins</div>
        <div class="cooldown"></div>
      </div>
    </div>
    <div class="controls-hint">Use ←↑↓→ to move</div>
    <div class="scoreboard">
      <h3>Players</h3>
      <div id="players-list"></div>
    </div>
    <div class="player-info">
      <div>
        <label for="player-name">Your Name</label>
        <input id="player-name" maxlength="10" type="text" />
      </div>
      <div>
        <button id="player-color">Change Color</button>
      </div>
    </div>

    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Game Over!</h2>
        <p id="eliminated-by"></p>
        <button id="restart-button">Play Again</button>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>

        apiKey: "AIzaSyAJed42M4OrW0M9g3OKREXNlP_iLDH8j6M",
        authDomain: "multiplayer-demo-19715.firebaseapp.com",

          "https://multiplayer-demo-19715-default-rtdb.europe-west1.firebasedatabase.app",

      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
    </script>

    <script src="/KeyPressListener.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
