<html>
  <head>
    <title>Multiplayer Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" type="text/css" />
    <style>
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="lobby" class="lobby">
      <div class="lobby-content">
        <button id="toggle-joke" class="toggle-button">Settings</button>
        <h1 id="lobby-title">Welcome to Multiplayer Game</h1>
        <div id="regular-content">
          <div class="lobby-buttons">
            <button id="create-room" class="lobby-button">Create</button>
            <button id="join-room" class="lobby-button">Join</button>
          </div>
          <!-- Add this new container -->
          <div id="room-info" class="hidden">
            <div class="room-status">
              <h3>Room Created</h3>
              <div class="room-code">
                Code: <span id="current-room-code"></span>
              </div>
            </div>
          </div>
          <div id="room-creation" class="hidden">
            <div class="player-select">
              <button data-players="2">2 Players</button>
              <button data-players="3">3 Players</button>
              <button data-players="4">4 Players</button>
            </div>
          </div>
          <div id="room-join" class="hidden">
            <input
              type="text"
              id="room-code"
              placeholder="Enter Code"
              maxlength="5"
            />
            <button id="join-game" class="lobby-button">Join</button>
          </div>
          <div id="game-setup" class="hidden">
            <div class="lobby-stats">
              <div class="stat">
                <span class="stat-value" id="players-online">0</span>
                <span class="stat-label">Players Online</span>
              </div>
            </div>
            <div class="lobby-form">
              <input
                type="text"
                id="lobby-name"
                placeholder="Enter your name"
                maxlength="10"
              />
              <div class="color-picker">
                <span class="color-label">Choose Color:</span>
                <div class="color-options">
                  <!-- Colors will be added by JS -->
                </div>
              </div>
              <button id="start-game" class="lobby-button">Start Game</button>
            </div>
          </div>
        </div>
        <div id="joke-content" class="hidden">
          <div class="controls-guide">
            <div class="controls-section">
              <h3>Movement</h3>
              <div class="controls-grid">
                <div class="control-key empty"></div>
                <div class="control-key">↑</div>
                <div class="control-key empty"></div>
                <div class="control-key">←</div>
                <div class="control-key">↓</div>
                <div class="control-key">→</div>
              </div>
            </div>
            <div class="controls-section">
              <h3>Powers</h3>
              <div
                style="
                  display: flex;
                  gap: 10px;
                  flex-wrap: wrap;
                  justify-content: center;
                "
              >
                <div class="control-key">W</div>
                <div class="control-key">E</div>
                <div class="control-key">R</div>
                <div class="control-key">A</div>
                <div class="control-key">Q</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="game-content" class="hidden">
      <div class="game-container"></div>
      <div class="powers-menu">
        <div
          class="power-button"
          data-power="speed"
          data-cost="3"
          data-key="KeyW"
        >
          <div class="key-hint">W</div>
          <span>Speed</span>
          <div class="cost">3 coins</div>
          <div class="cooldown"></div>
        </div>
        <div
          class="power-button"
          data-power="shield"
          data-cost="5"
          data-key="KeyE"
        >
          <div class="key-hint">E</div>
          <span>Shield</span>
          <div class="cost">5 coins</div>
          <div class="cooldown"></div>
        </div>
        <div
          class="power-button"
          data-power="teleport"
          data-cost="4"
          data-key="KeyR"
        >
          <div class="key-hint">R</div>
          <span>Teleport</span>
          <div class="cost">4 coins</div>
          <div class="cooldown"></div>
        </div>
        <div
          class="power-button"
          data-power="grow"
          data-cost="6"
          data-key="KeyA"
        >
          <div class="key-hint">A</div>
          <span>Grow</span>
          <div class="cost">6 coins</div>
          <div class="cooldown"></div>
        </div>
        <div
          class="power-button"
          data-power="ultimate"
          data-cost="12"
          data-key="KeyQ"
        >
          <div class="key-hint">Q</div>
          <span>Ultimate</span>
          <div class="cost">12 coins</div>
          <div class="cooldown"></div>
        </div>
      </div>
      <div class="controls-hint">Use ←↑↓→ to move</div>
      <div class="scoreboard">
        <h3>Players</h3>
        <div id="players-list"></div>
      </div>
      <div class="player-info">
        <div>
          <button id="player-color">Change Color</button>
        </div>
      </div>

      <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Game Over!</h2>
          <p id="eliminated-by"></p>
          <div class="stats-container">
            <div class="stat-item">
              <div class="stat-label">Coins Collected</div>
              <div class="stat-value" id="final-coins">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Time Survived</div>
              <div class="stat-value" id="time-survived">0:00</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Final Rank</div>
              <div class="stat-value" id="final-rank">#1</div>
            </div>
          </div>
          <button id="restart-button">Play Again</button>
        </div>
      </div>
    </div>

  </body>
</html>
